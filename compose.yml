# 開発環境: docker compose up で Rails と PostgreSQL が起動する
services:
  db:
    image: postgres:16.15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      TZ: Asia/Tokyo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 15

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    # 前回の終了時に残ったサーバーのPIDファイルを消してから起動する
    command: bash -c "rm -f tmp/pids/server.pid && bin/dev"
    volumes:
      - .:/app
      - bundle_data:/usr/local/bundle
    ports:
      # 3000番が使用中なら WEB_PORT=3001 docker compose up のように変えられる
      - "${WEB_PORT:-3000}:3000"
    environment:
      DATABASE_HOST: db
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: password
    depends_on:
      db:
        condition: service_healthy
    tty: true
    stdin_open: true

volumes:
  postgres_data:
  bundle_data:
