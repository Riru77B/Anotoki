# Render の Blueprint。Render の画面で「New → Blueprint」からこのリポジトリを選ぶと、DB と Web サービスがまとめて作られる
databases:
  - name: anotoki-link-db
    plan: free
    region: singapore
    databaseName: anotoki_link_production
    user: anotoki_link

services:
  - type: web
    name: anotoki-link
    runtime: ruby
    plan: free
    region: singapore
    buildCommand: "./bin/render-build.sh"
    startCommand: "bundle exec puma -C config/puma.rb"
    healthCheckPath: /up
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: anotoki-link-db
          property: connectionString
      # config/master.key の中身を Render の画面で入力する
      - key: RAILS_MASTER_KEY
        sync: false
      # メール送信（Brevo）。値は Render の画面で入力する
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      # 送信元。例：あのときリンク <xxxx@gmail.com>
      - key: MAILER_SENDER
        sync: false
