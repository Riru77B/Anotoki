      - content: "全体にざっと目を通して、ポイントをつかむ"
        scores: { analysis: 4, learning: 3 }
        note: "要点を見抜く分析。効率よく吸収する学習"
      - content: "直感で行き先を決めてから、情報で確かめる"
        scores: { analysis: 1, action: 3, creativity: 4 }
        note: "直感からひらめく発想。先に決める行動力。確かめる分析も少し"
      - content: "一緒に行く人と相談しながら決める"
        scores: { cooperation: 5, creativity: 1 }
        note: "人と一緒に考える協調。話す中でアイデアも"
  - position: 3
    axis: analysis
    content: "勉強や休日の予定など、計画していたことが予定どおりに進まなかったとき、あなたはまず何をしますか？"
    other_content: "勉強や休日の予定など、計画していたことが予定どおりに進まなかったとき、まず何をすると思いますか？"
    choices:
      - content: "どこで予定とずれたのかを確かめる"
