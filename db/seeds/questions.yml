# 自己診断の診断軸・質問・選択肢・配点（db/seeds.rb で読み込む）
# 文章や配点を変えたら `bin/rails db:seed` で DB に反映する。
# 診断軸の strength_scene / strength_portrait / growth_hint / hint_*（思い出しのヒント）は強みTOP3に、low_score_merit は下位2つに表示する。
# others_view は「自分では気づいていない強み」に、周りの人の目線で表示する。
# 質問の other_content は他者診断の問題文（画面の上に「〇〇さんは」と出して、それに続く文）。
# 選択肢の other_content は他者診断で言い換える選択肢だけに書く（ない場合は content を使う）。
# scores は点が入る軸だけを書く（書いていない軸は0点）。note は配点の方針メモで、DB には入らない。

axes:
  - key: analysis
    name: "分析力"
    description: "情報を整理・比較・分析する傾向"
    position: 1
    strength_scene: "情報が多くて複雑なときでも、整理して筋道を立てられます。見落としやミスを防ぐのが得意です"
    strength_portrait: "みんなが迷っているときこそ、落ち着いて状況を整理できる人です。あなたが「まず整理しよう」と言うだけで、周りの考えもまとまりやすくなります。"
    growth_hint: "じっくり考えられるのがあなたの良さ。急いで決めたいときは「7割の情報がそろったら決める」と決めておくと、さらに動きやすくなります"
    low_score_merit: "考えすぎずに直感で決められるので、判断が早く、状況の変化にも柔軟に対応できます"
    hint_study: "レポートや発表の前に、集めた資料を表やメモに整理してから書き始めた。そのおかげで、言いたいことがすっきりまとまった。"
    hint_work: "同じようなミスが続いたとき、「いつ・どこで起きているのか」を確かめた。原因がわかって、やり方を変えられた。"
    hint_club: "イベントや合宿の計画で、日程や費用をいくつかの案で比べた。みんなが納得できる案を選べた。"
    hint_private: "旅行や買い物でみんなが迷っているとき、情報を調べて比べ、わかりやすく伝えた。"
    others_view: "物事を冷静に整理して、筋道立てて考えられる人。迷ったときに相談すると、頭の中がすっきりする、と感じられています。"
  - key: problem_solving
    name: "課題解決力"
    description: "問題が起きたときに原因を考え、解決方法を探す傾向"
    position: 2
    strength_scene: "トラブルが起きても落ち着いて原因を探し、解決策を見つけられます"
    strength_portrait: "問題が起きても「どうすればいいか」に気持ちを切り替えられる人です。困ったときにあなたがいると、周りは「なんとかなる」と思えます。"
    growth_hint: "すぐに解決策が浮かぶのがあなたの良さ。相談されたときは、先に「どうしてほしいか」を聞いてみると、気持ちがより伝わります"
    low_score_merit: "問題にとらわれすぎず、気持ちを切り替えて前に進めます。周りの人の力を借りるのも上手です"
    hint_study: "グループ課題が締め切りに間に合わなそうになったとき、やることを洗い出して順番を組み直した。なんとか期限に間に合わせられた。"
    hint_work: "お客さんとのトラブルや急なシフトの穴が出たとき、その場でできる対応を考えて動いた。"
    hint_club: "「なんとなく不便」だと思っていたことを、ルールや仕組みを作って改善した。そのあと、みんなが動きやすくなった。"
    hint_private: "友人から悩みを相談されたとき、話を聞きながら一緒に解決策を考えた。"
    others_view: "困ったことが起きたときに、落ち着いて解決の道を探してくれる人。いざというときに頼りになる、と感じられています。"
  - key: action
    name: "行動力"
    description: "考えてから行動するか、まず行動するかという傾向"
    position: 3
    strength_scene: "チャンスを逃さず、すぐに動き出せます。周りが動くきっかけにもなります"
    strength_portrait: "考えるだけで終わらせず、まず一歩を踏み出せる人です。あなたが動くことで、止まっていた物事が前に進み始めます。"
    growth_hint: "すぐに動けるのがあなたの良さ。大事なことの前に5分だけ確認することを書き出すと、さらに安心して進められます"
    low_score_merit: "慎重に考えてから動くので、ミスや失敗を防ぎやすいです。準備を整えてから着実に進められます"
    hint_study: "興味のある授業や資格を見つけて、迷わず申し込んだ。始めてみたら、思った以上に面白かった。"
    hint_work: "やったことのない仕事のアルバイトを、思い切って始めた。"
    hint_club: "誰も動かないとき、自分から声をかけて準備を始めた。それがきっかけで、周りも動き出した。"
    hint_private: "遊びや旅行の計画を自分から言い出して、日程や行き先を決めて進めた。"
    others_view: "迷わず動き出して、周りを引っぱってくれる人。あなたが動くと、物事が前に進む、と感じられています。"
  - key: cooperation
    name: "協調性"
    description: "周囲の人と協力したり、相手の意見を理解したりする傾向"
    position: 4
    strength_scene: "周りの気持ちをくみ取り、チームの雰囲気をよくできます。考え方の違う人ともうまく付き合えます"
    strength_portrait: "自分のことだけでなく、周りの気持ちにも目を向けられる人です。あなたがいるチームは、意見が言いやすく、まとまりやすくなります。"
    growth_hint: "周りを大切にできるのがあなたの良さ。意見が分かれたときは、自分の考えも一言そえてみると、もっと頼られる存在になれます"
    low_score_merit: "周りに流されず、自分の考えで判断できます。一人でも集中して物事に取り組めます"
    hint_study: "グループワークで意見が分かれたとき、一人ひとりの考えを聞いてまとめ役になった。最後はみんなが納得できる形にまとまった。"
    hint_work: "忙しそうな人や新しく入った人に気づいて、さりげなく手伝った。「助かったよ」と言われた。"
    hint_club: "初対面の人が多い集まりで、自分から話しかけて場の雰囲気をやわらげた。"
    hint_private: "友人どうしがぎくしゃくしたとき、間に入ってお互いの話を聞き、仲直りのきっかけを作った。"
    others_view: "人の気持ちをくみ取って、チームの雰囲気をよくしてくれる人。あなたがいると、周りが安心して話せる、と感じられています。"
  - key: learning
    name: "学習力"
    description: "新しい知識や技術をどのように身につけるかという傾向"
    position: 5
    strength_scene: "新しい環境や知識にも早くなじみ、どんどん吸収できます"
    strength_portrait: "新しいことに出会ったとき、「知りたい」「できるようになりたい」と前向きに向き合える人です。あなたが身につけたことは、周りの人にとっても頼れる知識になります。"
    growth_hint: "吸収が早いのがあなたの良さ。学んだことを一度使ってみたり、人に説明したりすると、さらにしっかり身につきます"
    low_score_merit: "今持っている知識や経験を大切にして、得意なことをじっくり深めていけます"
    hint_study: "苦手だった科目を、自分に合う勉強のしかたを工夫して、できるようになった。"
    hint_work: "新しいアルバイトの仕事を、メモを取ったり先輩に聞いたりして、早く覚えられた。「覚えるのが早いね」と言われた。"
    hint_club: "やったことのない役割や技術を、調べたり教わったりして身につけた。"
    hint_private: "興味を持ったことを、本や動画でどんどん調べて、人に説明できるくらい詳しくなった。"
    others_view: "新しいことをどんどん吸収して、すぐに自分のものにできる人。覚えるのが早い、と感じられています。"
  - key: persistence
    name: "継続力"
    description: "失敗や困難があったときに、どのように継続するかという傾向"
    position: 6
    strength_scene: "結果がすぐに出なくても、コツコツ続けて着実に力をつけられます"
    strength_portrait: "結果がすぐに出なくても、自分のペースで積み重ねられる人です。あなたが続けてきたことは、時間がたつほど大きな力になります。"
    growth_hint: "続けられるのがあなたの良さ。ときどき「このやり方で合っているか」を振り返る時間をつくると、努力がさらに実を結びやすくなります"
    low_score_merit: "切り替えが早く、合わないと感じたら次へ進めます。いろいろなことに気軽に挑戦できます"
    hint_study: "資格や検定の勉強を、毎日少しずつ続けて、合格までやり切った。"
    hint_work: "大変なことがあっても、同じアルバイトを長く続けた。続けるうちに、任される仕事が増えた。"
    hint_club: "結果がなかなか出なくても、練習を続けた。少しずつできることが増えていった。"
    hint_private: "日記や筋トレ、趣味など、自分で決めた習慣を何か月も続けた。"
    others_view: "一度決めたことを、コツコツと最後までやり抜く人。任せておけば大丈夫、と感じられています。"
  - key: creativity
    name: "発想力"
    description: "新しい方法やアイデアを考える傾向"
    position: 7
    strength_scene: "行き詰まったときに新しい視点やアイデアを出し、状況を変えられます"
    strength_portrait: "当たり前を「もっとこうできるかも」と考えられる人です。あなたの一言が、周りに新しい見方を気づかせるきっかけになります。"
    growth_hint: "アイデアが豊かなのがあなたの良さ。思いついたら「最初の一歩」まで決めておくと、アイデアがもっと形になりやすくなります"
    low_score_merit: "実績のあるやり方を大切にするので、安定して確実に物事を進められます"
    hint_study: "発表やレポートで、ほかの人とは違う切り口や見せ方を考えた。「面白い」と言ってもらえた。"
    hint_work: "仕事のやり方に「もっとこうしたら楽になる」と気づいて、工夫や提案をした。"
    hint_club: "イベントや企画で、新しいアイデアを出した。それが採用されて、形になった。"
    hint_private: "誕生日のお祝いや遊びの計画で、みんなが驚くような工夫を考えた。"
    others_view: "ほかの人が思いつかないアイデアを出してくれる人。あなたと話すと新しい見方に気づける、と感じられています。"

questions:
  - position: 1
    axis: analysis
    content: "アルバイトや習い事などで、初めてのことのやり方を教わったとき、あなたはどうすることが多いですか？"
    other_content: "アルバイトや習い事などで、初めてのことのやり方を教わったとき、どうすることが多いと思いますか？"
    choices:
      - content: "全体の流れを頭の中で整理する"
        scores: { analysis: 5, learning: 1 }
        note: "全体を整理して理解する＝分析の典型"
      - content: "分からないところをその場で質問する"
        scores: { action: 3, cooperation: 2, learning: 5 }
        note: "分からないことを放置しない学習の典型。その場で聞ける行動力と協調も少し"
      - content: "実際に手を動かしながら覚える"
        scores: { action: 4, learning: 2 }
        note: "まず動く行動力。体で覚える学習"
      - content: "教わったことをメモにまとめる"
        scores: { analysis: 3, learning: 1, persistence: 2 }
        note: "整理する分析と記録して学ぶ学習。コツコツさで継続も少し"
      - content: "細かいことは、必要になったら調べる"
        scores: { problem_solving: 2, action: 3 }
        note: "細部にこだわらず進む行動力。必要なときに対処する課題解決"
  - position: 2
    axis: analysis
    content: "旅行の計画を立てることになり、行き先の候補や情報がたくさん集まりました。あなたはまず何をしますか？"
    other_content: "旅行の計画を立てることになり、行き先の候補や情報がたくさん集まりました。まず何をすると思いますか？"
    choices:
      - content: "情報を種類ごとに分けて整理する"
